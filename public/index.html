<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Vrinzu is a private, beautiful online journal. Write, reflect and remember." />

    <!-- PWA / iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vrinzu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the signed-in user's saved theme before first paint (avoids a light flash).
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (/^sb-.*-auth-token$/.test(key)) {
              var theme = JSON.parse(localStorage.getItem(key)).user.user_metadata.theme;
              if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
            }
          }
        } catch (e) {}
      })();
    </script>

    <title>Vrinzu | Your private online journal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Vrinzu.</noscript>
    <div id="root"></div>
  </body>
</html>
